[package]
name = "shared"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
strum_macros = "0.27.2"
time = { version = "0.3.41", features = ["macros", "formatting"] }
hex = "0.4.3"
utoipa = { version = "5.4.0", features = ["macros", "axum_extras", "uuid", "chrono"] }
axum = { version = "0.8.4", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
sha2 = "0.11.0-rc.0"
fnv_rs = "0.4.4"
subtle = "2"
zeroize = "1"

[features]
default = []
