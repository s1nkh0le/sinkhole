services:
  challenge:
    image: python:3.12-slim
    command: python -m http.server 80
    expose:
      - "80"

  tfilter:
    build: .
    depends_on:
      - challenge
    environment:
      UPSTREAM_HOST: challenge
      LISTEN_MAP: "8080:80"
      CTRL_PORT: "7000"
      DEBUG: "0"
      BODY_LIMIT_BYTES: "1048576"
      AUTH_HASH: "${AUTH_HASH}"      # inject from your shell or .env
    ports:
      - "8080:8080"   # public → filter
      - "7000:7000"   # control API
    # restart: unless-stopped      # optional: always restart
