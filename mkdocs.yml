site_name: sinkhole
site_url: https://s1nkh0le.github.io/sinkhole/

repo_name: sinkhole
repo_url: https://github.com/s1nkh0le/sinkhole
remote_branch: main


theme:
  name: material
  language: en

  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle

  logo: assets/icons/default/icon-512.png
  favicon: assets/icons/default/favicon.ico

  features:
    - navigation.instant
    - navigation.instant.progress
    - content.code.annotate
    # - content.tabs.link
    - navigation.tabs
    - navigation.tracking
    # - navigation.sections
    # - navigation.expand
    # - navigation.tabs.sticky
    - search.highlight
    - search.share
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/lightbulb
        name: Switch to light mode

  font:
    text: "Manrope"
    code: "JetBrains Mono"

plugins:
  - search:
  - tags:
      tags: true


markdown_extensions:
  - abbr
  - admonition
  - tables
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.betterem
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - md_in_html
  - toc:
      permalink: true


extra_css:
  - assets/css/app.css
  - assets/css/icons.css
  - assets/css/extra.css

extra_javascript:
  - assets/js/tex.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js



nav:
  - Index:
      - 'Overview': index.md
